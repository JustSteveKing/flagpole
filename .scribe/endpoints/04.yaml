        description: 'The ID of the SDK key, from List SDK Keys.'
        required: true
        example: 41
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanUrlParameters:
      project: checkout
      environment: production
      key_id: 41
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
      -
        custom: []
        status: 204
        content: null
        headers: []
        description: 'SDK key revoked.'
      -
        custom: []
        status: 401
        content: '{"type":"https:\/\/apiguide.dev\/errors\/unauthorized","title":"Unauthorized","status":401,"detail":"Unauthenticated."}'
        headers: []
        description: 'Authentication failed.'
      -
        custom: []
        status: 403
        content: '{"type":"https:\/\/apiguide.dev\/errors\/forbidden","title":"Forbidden","status":403,"detail":"Forbidden."}'
        headers: []
        description: 'Token is missing the sdk-keys:write ability.'
      -
        custom: []
        status: 404
        content: '{"type":"https:\/\/apiguide.dev\/errors\/resource-not-found","title":"Resource Not Found","status":404,"detail":"The resource was not found."}'
        headers: []
        description: 'No project, environment, or SDK key of that environment matches.'
    responseFields: []
    auth:
      - headers
      - Authorization
      - 'Bearer 6g43cv8PD1aE5beadkZfhV6'
    controller: null
    method: null
    route: null
