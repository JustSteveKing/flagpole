        example: checkout
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      environment:
        custom: []
        name: environment
        description: 'The environment key, unique within the project.'
        required: true
        example: production
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanUrlParameters:
      project: checkout
      environment: production
    queryParameters:
      cursor:
        custom: []
        name: cursor
        description: 'Opaque cursor from a Link header. Omit it for the first page.'
        required: false
        example: architecto
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanQueryParameters:
