  -
    custom: []
    httpMethods:
      - POST
    uri: 'v1/projects/{project}/environments/{environment}/sdk-keys'
    metadata:
      custom: []
      groupName: 'SDK keys'
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: 'Create SDK Key'
      description: 'Create a key that an OpenFeature OFREP provider uses to evaluate the flags of this environment, and nothing else. Use it once per application or deployment; send an Idempotency-Key so a retry does not create a second key. Returns the key with its secret in meta.token, shown only this once.'
      authenticated: true
      deprecated: false
    headers:
      Authorization: 'Bearer {YOUR_BEARER_TOKEN}'
      Idempotency-Key: '"sdk-key-retry-1"'
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      project:
        custom: []
        name: project
        description: 'The project key.'
        required: true
        example: checkout
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      environment:
        custom: []
        name: environment
        description: 'The environment key, unique within the project.'
        required: true
        example: production
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanUrlParameters:
      project: checkout
      environment: production
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      name:
        custom: []
        name: name
        description: 'A label, so the key can be told apart from others when revoking one. Up to 255 characters.'
        required: true
        example: 'checkout-web production'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      expires_at:
        custom: []
        name: expires_at
        description: 'When the key stops working, in the future. Leave it out for a key that never expires: one that expires on its own turns every flag back to its code default.'
        required: false
        example: architecto
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanBodyParameters:
      name: 'checkout-web production'
      expires_at: architecto
    fileParameters: []
    responses:
      -
        custom: []
        status: 201
        content: '{"data":{"id":"41","name":"checkout-web production","last_used_at":"2026-10-21T09:12:00+00:00","expires_at":null,"created_at":"2026-10-21T09:00:00+00:00"},"meta":{"token":"41|ofrep-example-secret","token_type":"Bearer"}}'
        headers: []
        description: 'SDK key created. meta.token is the only time its secret is returned.'
      -
        custom: []
        status: 401
        content: '{"type":"https:\/\/apiguide.dev\/errors\/unauthorized","title":"Unauthorized","status":401,"detail":"Unauthenticated."}'
        headers: []
        description: 'Authentication failed.'
      -
        custom: []
        status: 403
        content: '{"type":"https:\/\/apiguide.dev\/errors\/forbidden","title":"Forbidden","status":403,"detail":"Forbidden."}'
        headers: []
        description: 'Token is missing the sdk-keys:write ability.'
      -
        custom: []
        status: 404
        content: '{"type":"https:\/\/apiguide.dev\/errors\/resource-not-found","title":"Resource Not Found","status":404,"detail":"The resource was not found."}'
        headers: []
        description: 'No project with this key belongs to the authenticated user, or it has no environment with this key.'
      -
        custom: []
        status: 422
        content: '{"type":"https:\/\/apiguide.dev\/errors\/validation-failed","title":"Validation Failed","status":422,"detail":"The name field is required.","errors":{"name":["The name field is required."]}}'
        headers: []
        description: 'The name is missing, or expires_at is not a date in the future.'
    responseFields:
      data.last_used_at:
        custom: []
        name: data.last_used_at
        description: 'When an application last used the key, or null if none has.'
        required: true
        example: null
        type: string
