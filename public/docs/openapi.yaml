  /ofrep/v1/evaluate/flags:
    post:
      summary: 'Evaluate Flags'
      operationId: evaluateFlags
      description: 'Evaluate every flag in the environment of the SDK key for one context. Called by an OpenFeature OFREP provider in the browser or on a device, which polls it with the last ETag in If-None-Match. Returns every flag with its value or its own error, or 304 with no body while nothing it would see has changed. The 304 to a POST departs from RFC 9110 on purpose, because OFREP specifies it.'
      parameters: []
      responses:
        200:
          description: 'Every flag, evaluated, with an ETag for the next poll.'
          content:
            application/json:
              schema:
                type: object
                example:
                  flags:
                    -
                      key: new-checkout
                      value: true
                      variant: 'on'
                      reason: TARGETING_MATCH
                    -
                      key: theme
                      value: blue
                      variant: blue
                      reason: STATIC
                    -
                      key: rollout
                      errorCode: TARGETING_KEY_MISSING
                      errorDetails: 'The flag rollout serves a percentage rollout, which needs a targetingKey in the context.'
                properties:
                  flags:
                    type: array
                    example:
                      -
                        key: new-checkout
                        value: true
                        variant: 'on'
                        reason: TARGETING_MATCH
                      -
                        key: theme
                        value: blue
                        variant: blue
                        reason: STATIC
                      -
                        key: rollout
                        errorCode: TARGETING_KEY_MISSING
                        errorDetails: 'The flag rollout serves a percentage rollout, which needs a targetingKey in the context.'
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                          example: new-checkout
                        value:
                          type: boolean
                          example: true
                        variant:
                          type: string
                          example: 'on'
                        reason:
                          type: string
                          example: TARGETING_MATCH
        304:
          description: 'If-None-Match still matches: nothing this context would see has changed.'
        400:
          description: 'The context is missing or not an object (INVALID_CONTEXT), or the body is not JSON (PARSE_ERROR).'
          content:
            application/json:
              schema:
                type: object
                example:
                  errorCode: INVALID_CONTEXT
                  errorDetails: 'The context must be an object, and its targetingKey a string.'
                properties:
                  errorCode:
                    type: string
                    example: INVALID_CONTEXT
                  errorDetails:
                    type: string
                    example: 'The context must be an object, and its targetingKey a string.'
        401:
          description: 'The SDK key is missing, revoked or expired.'
          content:
            application/problem+json:
              schema:
                type: object
                example:
                  type: 'https://apiguide.dev/errors/unauthorized'
                  title: Unauthorized
                  status: 401
                  detail: Unauthenticated.
                properties:
                  type:
                    type: string
                    example: 'https://apiguide.dev/errors/unauthorized'
                  title:
                    type: string
                    example: Unauthorized
                  status:
                    type: integer
                    example: 401
                  detail:
                    type: string
                    example: Unauthenticated.
        403:
          description: 'The token is not an SDK key.'
          content:
            application/problem+json:
              schema:
                type: object
                example:
                  type: 'https://apiguide.dev/errors/forbidden'
                  title: Forbidden
                  status: 403
                  detail: Forbidden.
                properties:
                  type:
                    type: string
                    example: 'https://apiguide.dev/errors/forbidden'
                  title:
                    type: string
                    example: Forbidden
                  status:
                    type: integer
                    example: 403
                  detail:
                    type: string
                    example: Forbidden.
        429:
          description: 'More than 600 requests in a minute with this SDK key. Retry-After says when to try again.'
          content:
            application/problem+json:
              schema:
                type: object
                example:
                  type: 'https://apiguide.dev/errors/too-many-requests'
                  title: 'Too Many Requests'
                  status: 429
                  detail: 'Too many requests. Please try again later.'
                properties:
                  type:
                    type: string
                    example: 'https://apiguide.dev/errors/too-many-requests'
                  title:
                    type: string
                    example: 'Too Many Requests'
                  status:
                    type: integer
                    example: 429
                  detail:
                    type: string
                    example: 'Too many requests. Please try again later.'
        500:
          description: 'An unexpected error. The provider falls back to the defaults in code.'
          content:
            application/json:
              schema:
                type: object
                example:
                  errorDetails: 'Flags could not be evaluated. Try again shortly.'
                properties:
                  errorDetails:
                    type: string
                    example: 'Flags could not be evaluated. Try again shortly.'
      tags:
        - OFREP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                context:
                  type: object
                  description: 'The evaluation context: any properties the rules of the flags look at, such as email or plan.'
                  example:
                    targetingKey: user-123
                    email: jane@example.com
                    plan: pro
                  properties:
                    targetingKey:
                      type: string
                      description: 'Who the evaluation is for. Required by percentage rollouts, which put the same subject in the same variant every time.'
                      example: user-123
              required:
                - context
