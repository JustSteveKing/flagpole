# legible scores public/docs/openapi.yaml for agent readiness: what will trip up an LLM calling
# the API as tools. CI fails on any warning or a score under 95. `legible explain <rule>` says why a
# rule matters. https://github.com/JustSteveKing/legible
fail-on: warning
fail-under: 95

ignore:
  - rule: error-shape
    operations:
      - POST /v1/auth/register
      - POST /v1/auth/login
      - POST /v1/auth/password/forgot
      - POST /v1/auth/password/reset
      - GET /v1/auth/password/reset/*
      - POST /v1/auth/tokens
      - POST /v1/webhooks
      - PATCH /v1/webhooks/*
      - POST /v1/projects
      - PATCH /v1/projects/*
      - POST /v1/projects/*/environments
      - PATCH /v1/projects/*/environments/*
      - POST /v1/projects/*/flags
      - PATCH /v1/projects/*/flags/*
      - PATCH /v1/projects/*/flags/*/settings/*
      - POST /v1/projects/*/environments/*/sdk-keys
    reason: >
      Validation problems add an errors member keyed by field, which apiguide.dev's
      validation-failed type defines. Every problem shares type, title, status and detail.
  - rule: naming-style
    operations:
      - POST /ofrep/v1/evaluate/flags
      - POST /ofrep/v1/evaluate/flags/*
    reason: >
      OpenFeature's Remote Evaluation Protocol fixes these names (targetingKey, errorCode,
      errorDetails). Providers read them as OFREP spells them (ADR-0001).
  - rule: error-shape
    operations:
      - POST /ofrep/v1/evaluate/flags
      - POST /ofrep/v1/evaluate/flags/*
    reason: >
      OFREP defines its own error bodies for 400, 404 and 500, which its providers read; problem
      details would be lost on them (ADR-0002). Every other error here is problem details.
